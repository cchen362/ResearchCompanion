version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medcompanion-postgres
    restart: always
    environment:
      - POSTGRES_DB=medcompanion
      - POSTGRES_USER=meduser
      - POSTGRES_PASSWORD=${DB_PASSWORD:-medpass123}
      # Performance tuning
      - POSTGRES_MAX_CONNECTIONS=100
      - POSTGRES_SHARED_BUFFERS=256MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
      - POSTGRES_MAINTENANCE_WORK_MEM=128MB
      - POSTGRES_CHECKPOINT_COMPLETION_TARGET=0.9
      - POSTGRES_WAL_BUFFERS=16MB
      - POSTGRES_DEFAULT_STATISTICS_TARGET=100
      - POSTGRES_RANDOM_PAGE_COST=1.1
      - POSTGRES_EFFECTIVE_IO_CONCURRENCY=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduser -d medcompanion"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  medical-companion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: medical-companion-app
    restart: always
    ports:
      - "6767:6767"   # Nginx frontend
      - "3001:3001"   # Express backend
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://meduser:${DB_PASSWORD:-medpass123}@postgres:5432/medcompanion
      - USE_POSTGRESQL=true
      - DB_MAX_CONNECTIONS=50
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://localhost:6767}
      - LOG_LEVEL=info
      - ENABLE_MONITORING=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Optional: Backup service
  backup:
    image: postgres:15-alpine
    container_name: medcompanion-backup
    restart: "no"
    profiles: ["backup"]  # Only runs when explicitly requested
    environment:
      - PGPASSWORD=${DB_PASSWORD:-medpass123}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
      while true; do
        echo 'Starting backup at $$(date)';
        pg_dump -h postgres -U meduser medcompanion | gzip > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz;
        echo 'Backup completed at $$(date)';
        find /backups -name 'backup-*.sql.gz' -mtime +30 -delete;
        echo 'Old backups cleaned up';
        sleep 86400;
      done
      "
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: Redis for caching (future enhancement)
  redis:
    image: redis:7-alpine
    container_name: medcompanion-redis
    restart: always
    profiles: ["cache"]  # Only runs when cache profile is activated
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: medcompanion-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16