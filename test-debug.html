<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Panel Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        pre {
            background: white;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>Medical Companion PWA - Debug Panel Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function testLocalStorage() {
            addResult('<strong>Testing localStorage...</strong>');
            try {
                // Check if logged in
                const token = localStorage.getItem('auth_token');
                const userId = localStorage.getItem('user_id');

                if (token) {
                    addResult(`✅ User is logged in (userId: ${userId})`, 'success');
                } else {
                    addResult('⚠️ User is not logged in', 'warning');
                }

                // List all localStorage keys
                const keys = Object.keys(localStorage);
                addResult(`localStorage contains ${keys.length} items: ${keys.join(', ')}`, 'info');
            } catch (error) {
                addResult(`❌ Error checking localStorage: ${error}`, 'error');
            }
        }

        async function testIndexedDB() {
            addResult('<strong>Testing IndexedDB...</strong>');
            try {
                const dbName = 'MedCompanionDB';
                const request = indexedDB.open(dbName);

                request.onsuccess = async function(event) {
                    const db = event.target.result;
                    addResult(`✅ Connected to IndexedDB version ${db.version}`, 'success');

                    // List all object stores
                    const storeNames = Array.from(db.objectStoreNames);
                    addResult(`Object stores: ${storeNames.join(', ')}`, 'info');

                    // Check notifications
                    if (storeNames.includes('notifications')) {
                        const tx = db.transaction(['notifications'], 'readonly');
                        const store = tx.objectStore('notifications');
                        const getAllRequest = store.getAll();

                        getAllRequest.onsuccess = function() {
                            const notifications = getAllRequest.result;
                            addResult(`📬 Notifications in DB: ${notifications.length}`, 'info');

                            if (notifications.length > 0) {
                                addResult('<pre>' + JSON.stringify(notifications.slice(0, 2), null, 2) + '</pre>', 'info');
                            }
                        };
                    }

                    // Check topics
                    if (storeNames.includes('topics')) {
                        const tx = db.transaction(['topics'], 'readonly');
                        const store = tx.objectStore('topics');
                        const getAllRequest = store.getAll();

                        getAllRequest.onsuccess = function() {
                            const topics = getAllRequest.result;
                            addResult(`📚 Topics in DB: ${topics.length}`, 'info');

                            if (topics.length > 0) {
                                addResult(`Topic names: ${topics.map(t => t.name).join(', ')}`, 'info');
                            }
                        };
                    }
                };

                request.onerror = function(event) {
                    addResult(`❌ Failed to open IndexedDB: ${event.target.error}`, 'error');
                };
            } catch (error) {
                addResult(`❌ Error testing IndexedDB: ${error}`, 'error');
            }
        }

        async function testNotificationCleanup() {
            addResult('<strong>Testing Notification Cleanup...</strong>');
            try {
                const dbName = 'MedCompanionDB';
                const request = indexedDB.open(dbName);

                request.onsuccess = async function(event) {
                    const db = event.target.result;

                    // Get all topics
                    const topicsStore = db.transaction(['topics'], 'readonly').objectStore('topics');
                    const topicsRequest = topicsStore.getAll();

                    topicsRequest.onsuccess = async function() {
                        const topics = topicsRequest.result;
                        const validTopicIds = new Set(topics.map(t => t.id));

                        // Get all notifications
                        const notifStore = db.transaction(['notifications'], 'readonly').objectStore('notifications');
                        const notifRequest = notifStore.getAll();

                        notifRequest.onsuccess = function() {
                            const notifications = notifRequest.result;
                            let orphanedCount = 0;

                            notifications.forEach(n => {
                                const topicId = n.data?.topicId;
                                if (topicId && !validTopicIds.has(topicId)) {
                                    orphanedCount++;
                                }
                            });

                            if (orphanedCount > 0) {
                                addResult(`⚠️ Found ${orphanedCount} orphaned notifications from deleted topics`, 'warning');
                                addResult(`You can clean these up using the "Clean orphaned" button in the notification panel`, 'info');
                            } else {
                                addResult(`✅ No orphaned notifications found`, 'success');
                            }

                            // Show breakdown
                            const byTopic = {};
                            notifications.forEach(n => {
                                const topicId = n.data?.topicId || '[No topic]';
                                const isOrphaned = topicId !== '[No topic]' && !validTopicIds.has(topicId);
                                const key = isOrphaned ? `[Orphaned: ${topicId}]` : topicId;
                                byTopic[key] = (byTopic[key] || 0) + 1;
                            });

                            addResult(`Notifications by topic: <pre>${JSON.stringify(byTopic, null, 2)}</pre>`, 'info');
                        };
                    };
                };

                request.onerror = function(event) {
                    addResult(`❌ Failed to test notification cleanup: ${event.target.error}`, 'error');
                };
            } catch (error) {
                addResult(`❌ Error testing notification cleanup: ${error}`, 'error');
            }
        }

        async function testAppEndpoint() {
            addResult('<strong>Testing app endpoint...</strong>');
            try {
                const response = await fetch('http://localhost:5181/');
                const text = await response.text();

                if (response.ok) {
                    addResult('✅ App is running on port 5181', 'success');

                    // Check for our test elements
                    if (text.includes('TEST: App is rendering')) {
                        addResult('✅ Test div is in the HTML', 'success');
                    } else {
                        addResult('⚠️ Test div NOT found in HTML', 'warning');
                    }

                    if (text.includes('DEBUG PANEL') || text.includes('DebugPanel')) {
                        addResult('✅ DebugPanel reference found in HTML', 'success');
                    } else {
                        addResult('⚠️ DebugPanel NOT found in HTML', 'warning');
                    }
                } else {
                    addResult(`❌ App returned status ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Failed to reach app: ${error}`, 'error');
            }
        }

        // Run all tests
        async function runTests() {
            addResult('<h2>Starting tests...</h2>');

            testLocalStorage();
            await new Promise(resolve => setTimeout(resolve, 100));

            await testIndexedDB();
            await new Promise(resolve => setTimeout(resolve, 100));

            await testNotificationCleanup();
            await new Promise(resolve => setTimeout(resolve, 100));

            await testAppEndpoint();

            addResult('<hr><strong>Tests complete!</strong> <a href="http://localhost:5181" target="_blank">Open App →</a>');
        }

        runTests();
    </script>
</body>
</html>
