services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: medcompanion-postgres
    environment:
      POSTGRES_DB: medcompanion
      POSTGRES_USER: meduser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medpass123}
    ports:
      - "5434:5432"  # Mapped to 5434 to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduser -d medcompanion"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - medcompanion-network

  # Medical Companion Application (Frontend + Backend)
  medical-companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-companion

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "6767:6767"  # nginx frontend
      - "3001:3001"  # backend API

    environment:
      NODE_ENV: production
      PORT: 3001
      # Database connection with SSL disabled for local
      DATABASE_URL: postgresql://meduser:${DB_PASSWORD:-medpass123}@postgres:5432/medcompanion?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      PUBMED_API_KEY: ${PUBMED_API_KEY}
      ENABLE_REAL_MEDICAL_SEARCH: "true"
      ENABLE_WEB_SEARCH: "true"
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cl.zyroi.com,http://100.94.82.35:6767,http://localhost:6767}
      PRODUCTION_URL: ${PRODUCTION_URL:-https://cl.zyroi.com}

    volumes:
      # Persist data
      - medical-data:/app/data
      - backend-data:/app/backend/data

    restart: unless-stopped
    networks:
      - medcompanion-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  medical-data:
    driver: local
  backend-data:
    driver: local

networks:
  medcompanion-network:
    driver: bridge
