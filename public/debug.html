<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Page</title>
</head>
<body>
    <h1>Debug Page</h1>
    <div id="status"></div>
    <script>
        const status = document.getElementById('status');
        status.innerHTML = '<p>JavaScript is working!</p>';

        // Try to load React
        import('/src/main.tsx').then(() => {
            status.innerHTML += '<p>Main.tsx loaded successfully!</p>';
        }).catch(err => {
            status.innerHTML += '<p style="color:red">Error loading main.tsx: ' + err.message + '</p>';
            console.error('Error:', err);
        });
    </script>
</body>
</html>
