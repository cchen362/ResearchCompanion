<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache - Medical Companion PWA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #4F46E5;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      color: #6B7280;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .status {
      background: #F3F4F6;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      min-height: 100px;
      font-size: 14px;
      color: #374151;
    }
    .status-item {
      margin: 5px 0;
      display: flex;
      align-items: center;
    }
    .status-item.success {
      color: #10B981;
    }
    .status-item.error {
      color: #EF4444;
    }
    .status-item.pending {
      color: #6B7280;
    }
    .icon {
      margin-right: 8px;
      font-size: 16px;
    }
    button {
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    button:hover:not(:disabled) {
      background: #4338CA;
    }
    button:disabled {
      background: #9CA3AF;
      cursor: not-allowed;
    }
    .warning {
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #92400E;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #E5E7EB;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 Clear Cache & Fix Issues</h1>
    <p class="subtitle">Medical Companion PWA - Cache Management Utility</p>

    <div class="warning">
      <strong>⚠️ Warning:</strong> This will clear all app data including saved recordings, findings, and preferences. Make sure to export any important data first.
    </div>

    <div class="status" id="status">
      <div class="status-item pending">
        <span class="icon">⏳</span>
        Ready to clear cache and fix version issues
      </div>
    </div>

    <button id="clearBtn" onclick="clearEverything()">
      Clear All Cache & Fix App
    </button>

    <button id="returnBtn" onclick="window.location.href='/'" disabled>
      Return to App
    </button>
  </div>

  <script>
    async function log(message, type = 'pending') {
      const status = document.getElementById('status');
      const item = document.createElement('div');
      item.className = `status-item ${type}`;

      let icon = '⏳';
      if (type === 'success') icon = '✅';
      if (type === 'error') icon = '❌';
      if (type === 'processing') {
        icon = '<span class="spinner"></span>';
        item.innerHTML = `${icon}${message}`;
      } else {
        item.innerHTML = `<span class="icon">${icon}</span>${message}`;
      }

      status.appendChild(item);
      status.scrollTop = status.scrollHeight;
    }

    async function clearEverything() {
      const clearBtn = document.getElementById('clearBtn');
      const returnBtn = document.getElementById('returnBtn');

      clearBtn.disabled = true;
      document.getElementById('status').innerHTML = '';

      try {
        // 1. Unregister all service workers
        log('Unregistering service workers...', 'processing');
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
          log(`Unregistered ${registrations.length} service worker(s)`, 'success');
        } else {
          log('Service workers not supported', 'pending');
        }

        // 2. Clear all caches
        log('Clearing all caches...', 'processing');
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (let name of cacheNames) {
            await caches.delete(name);
          }
          log(`Cleared ${cacheNames.length} cache(s)`, 'success');
        } else {
          log('Caches API not supported', 'pending');
        }

        // 3. Clear IndexedDB
        log('Clearing IndexedDB databases...', 'processing');
        const databases = ['MedicalCompanionDB', 'MedCompanionDB'];
        for (let dbName of databases) {
          try {
            await deleteDatabase(dbName);
            log(`Deleted database: ${dbName}`, 'success');
          } catch (err) {
            log(`Could not delete ${dbName}: ${err.message}`, 'error');
          }
        }

        // 4. Clear localStorage
        log('Clearing localStorage...', 'processing');
        localStorage.clear();
        log('LocalStorage cleared', 'success');

        // 5. Clear sessionStorage
        log('Clearing sessionStorage...', 'processing');
        sessionStorage.clear();
        log('SessionStorage cleared', 'success');

        // 6. Clear cookies for localhost
        log('Attempting to clear cookies...', 'processing');
        document.cookie.split(";").forEach(function(c) {
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        log('Cookies cleared', 'success');

        // Success!
        log('', 'pending');
        log('✨ All cache and data cleared successfully!', 'success');
        log('The app will reload with fresh data.', 'success');

        returnBtn.disabled = false;

        // Auto-reload after 3 seconds
        setTimeout(() => {
          log('Reloading app...', 'processing');
          window.location.href = '/';
        }, 3000);

      } catch (error) {
        console.error('Error clearing cache:', error);
        log(`Error: ${error.message}`, 'error');
        log('Please try manually clearing browser cache', 'error');
        clearBtn.disabled = false;
      }
    }

    function deleteDatabase(name) {
      return new Promise((resolve, reject) => {
        const deleteReq = indexedDB.deleteDatabase(name);
        deleteReq.onsuccess = () => resolve();
        deleteReq.onerror = () => reject(new Error(`Failed to delete ${name}`));
        deleteReq.onblocked = () => reject(new Error(`Database ${name} is blocked`));
      });
    }

    // Check current status on load
    window.addEventListener('load', async () => {
      const status = document.getElementById('status');
      status.innerHTML = '';

      // Check service workers
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        if (registrations.length > 0) {
          log(`Found ${registrations.length} active service worker(s)`, 'pending');
        }
      }

      // Check databases
      try {
        const dbReq = indexedDB.open('MedicalCompanionDB', 1);
        dbReq.onsuccess = () => {
          dbReq.result.close();
          log('IndexedDB detected - ready to clear', 'pending');
        };
        dbReq.onerror = () => {
          log('No existing IndexedDB found', 'success');
        };
      } catch (e) {
        // Ignore
      }
    });
  </script>
</body>
</html>
